name = "GranvilleMoore"
defaultTargets = ["GranvilleMoore"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

# Mathlib's standard linter set. The `weak.` prefix means Lake will not fail if a
# revision does not define the option. Enabling it here is what makes the
# mechanically-enforceable half of the style rules enforced from now on.
weak.linter.mathlibStandardSet = true

# The Mathlib pin matches `lean-toolchain` (leanprover/lean4:v4.34.0-rc2), and every
# transitive rev in `lake-manifest.json` is the one Mathlib's own manifest ships at
# tag v4.34.0-rc2. Bump the two together, re-deriving the manifest from Mathlib's at
# the matching tag.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "85e3a25e006c35636f0e53b0e9296caca2685bc0"

[[lean_lib]]
name = "GranvilleMoore"

# The comparator pair. Deliberately NOT in defaultTargets: `Challenge` carries a
# permanent `sorry` (its statements are the artifact), and `lake lint` derives its
# scope from the default targets. The comparator builds both modules itself.
[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
